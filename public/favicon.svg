<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The site's own motif at tab size: a white dwarf with its orbit, tilted to
    the same ~19 degrees the hero's orbit rests at.

    Drawn rather than scaled down from the hero because at 16px almost nothing
    survives. Everything here is sized for that: the star is a solid disc with
    a soft halo instead of a gradient sphere, and the orbit is a single stroke
    heavy enough not to disappear when the browser resamples it. The backdrop
    is opaque site-navy so the mark holds its own shape against a light tab
    strip as well as a dark one.
  -->
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dce9ff" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#a9c8ff" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#a9c8ff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="#05070f" />
  <circle cx="16" cy="16" r="12" fill="url(#halo)" />

  <!-- Orbit behind the star, so the star reads as the nearer object. -->
  <ellipse
    cx="16" cy="16" rx="13" ry="4.4"
    transform="rotate(-19 16 16)"
    fill="none" stroke="#a9c8ff" stroke-opacity="0.75" stroke-width="1.3"
  />

  <circle cx="16" cy="16" r="4.6" fill="#ffffff" />

  <!-- The transiting planet, caught at the near edge of the orbit. -->
  <circle cx="27.2" cy="12.1" r="1.9" fill="#7fb2e8" />
</svg>
