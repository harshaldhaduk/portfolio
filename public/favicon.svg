<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The white dwarf and its orbit alone, on a transparent ground — no plate
    behind it. Freed of the box, the mark is scaled up to use the whole frame
    rather than sitting inset within one.

    Tilted to the same ~19 degrees the hero's orbit rests at, and drawn for tab
    size rather than scaled down from the hero: a solid disc with a soft halo
    instead of a gradient sphere, and a single orbit stroke heavy enough to
    survive resampling to 16px.

    The halo is doing real work now that there is no backdrop. A bare white
    disc would vanish on a light tab strip, so the glow carries enough blue to
    keep an edge visible against pale ground while still reading as light
    against dark.
  -->
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cfe2ff" stop-opacity="0.9" />
      <stop offset="38%" stop-color="#8fb8ff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#6d9bf0" stop-opacity="0" />
    </radialGradient>
  </defs>

  <circle cx="16" cy="16" r="15" fill="url(#halo)" />

  <!-- Orbit behind the star, so the star reads as the nearer object. -->
  <ellipse
    cx="16" cy="16" rx="15" ry="5"
    transform="rotate(-19 16 16)"
    fill="none" stroke="#9cc2ff" stroke-width="1.6"
  />

  <circle cx="16" cy="16" r="5.4" fill="#ffffff" />

  <!-- The transiting planet, caught at the near edge of the orbit. -->
  <circle cx="29" cy="11.4" r="2.1" fill="#6fa6e6" />
</svg>
